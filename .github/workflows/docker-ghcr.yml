name: Build and push image (GHCR)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-ghcr-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/isomiki/cal.diy

jobs:
  build:
    name: Build and push linux/amd64
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      # README: "an available database is currently required during the build process".
      # Empty DB is enough; no migrations are applied at build time.
      database:
        image: postgres:16
        env:
          POSTGRES_USER: build
          POSTGRES_PASSWORD: build
          POSTGRES_DB: calendso
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U build"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3
        with:
          # host network lets `RUN` steps reach the service container on localhost:5432
          driver-opts: network=host
          buildkitd-flags: --allow-insecure-entitlement network.host

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short,prefix=sha-

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          network: host
          allow: network.host
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # NEXT_PUBLIC_WEBAPP_URL is intentionally omitted: the Dockerfile bakes a
          # placeholder and scripts/start.sh swaps in the runtime value.
          # Everything below is inlined into the client bundle and cannot change at runtime.
          build-args: |
            DATABASE_URL=postgresql://build:build@localhost:5432/calendso
            NEXT_PUBLIC_API_V2_URL=${{ vars.NEXT_PUBLIC_API_V2_URL }}
            NEXT_PUBLIC_LICENSE_CONSENT=${{ vars.NEXT_PUBLIC_LICENSE_CONSENT }}
            NEXT_PUBLIC_WEBSITE_TERMS_URL=${{ vars.NEXT_PUBLIC_WEBSITE_TERMS_URL }}
            NEXT_PUBLIC_WEBSITE_PRIVACY_POLICY_URL=${{ vars.NEXT_PUBLIC_WEBSITE_PRIVACY_POLICY_URL }}
            NEXT_PUBLIC_SINGLE_ORG_SLUG=${{ vars.NEXT_PUBLIC_SINGLE_ORG_SLUG }}
            ORGANIZATIONS_ENABLED=${{ vars.ORGANIZATIONS_ENABLED }}
            CALCOM_TELEMETRY_DISABLED=${{ vars.CALCOM_TELEMETRY_DISABLED }}
            CSP_POLICY=${{ vars.CSP_POLICY }}
